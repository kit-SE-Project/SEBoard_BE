server:
  address: ${API_BIND_ADDRESS:127.0.0.1}
  port: ${API_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: server-allday
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 24
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    clean-disabled: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
allday:
  primary-enabled: ${PRIMARY_ENABLED:false}
  primary-database: ${PRIMARY_DATABASE:capdi_main}
  real-test-enabled: ${REAL_TEST_ENABLED:false}
  reservation-open-server-ids: ${RESERVATION_OPEN_SERVER_IDS:}
  demo-auth-enabled: ${DEMO_AUTH_ENABLED:false}
  demo-seed-enabled: ${DEMO_SEED_ENABLED:false}
  demo-worker-enabled: ${DEMO_WORKER_ENABLED:false}
  demo-runner-enabled: ${DEMO_RUNNER_ENABLED:true}
  demo-jwt-key: ${DEMO_JWT_KEY:}
  test-auth-no-expiry: ${TEST_AUTH_NO_EXPIRY:false}
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  scheduler-delay-ms: ${SCHEDULER_DELAY_MS:5000}
  dev-auth-enabled: ${DEV_AUTH_ENABLED:false}
  dev-seed-enabled: ${DEV_SEED_ENABLED:false}
  student-one-token: ${DEV_STUDENT_ONE_TOKEN:}
  student-two-token: ${DEV_STUDENT_TWO_TOKEN:}
  admin-token: ${DEV_ADMIN_TOKEN:}
  worker-token: ${WORKER_TOKEN:}
  credential-key: ${CREDENTIAL_KEY:}
  minimum-switch-seconds: ${MINIMUM_SWITCH_SECONDS:3600}
  prepare-lead-seconds: ${PREPARE_LEAD_SECONDS:3600}
  observation-max-age-seconds: ${OBSERVATION_MAX_AGE_SECONDS:120}
  seboard-sso:
    backend-origin: ${SEBOARD_SSO_BACKEND_ORIGIN:}
    portal-url: ${SEBOARD_SSO_PORTAL_URL:}
    public-origin: ${ALLDAY_SSO_PUBLIC_ORIGIN:}
    client-secret: ${ALLDAY_SSO_CLIENT_SECRET:}
  seboard-rental-authority: ${SEBOARD_RENTAL_AUTHORITY:ROLE_KUMOH}
  real-rental-member-ids: ${REAL_RENTAL_MEMBER_IDS:}
  immediate-reservation-until: ${IMMEDIATE_RESERVATION_UNTIL:}
  immediate-reservation-no-expiry: ${IMMEDIATE_RESERVATION_NO_EXPIRY:false}
  immediate-reservation-member-id: ${IMMEDIATE_RESERVATION_MEMBER_ID:0}
  immediate-reservation-member-ids: ${IMMEDIATE_RESERVATION_MEMBER_IDS:}
  immediate-reservation-server-id: ${IMMEDIATE_RESERVATION_SERVER_ID:0}
  public-ssh-host: ${PUBLIC_SSH_HOST:}
  public-ssh-port: ${PUBLIC_SSH_PORT:0}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
